# 站点主配置
baseURL = "https://example.github.io/"   # 线上会被 Actions 自动覆盖，这里不影响部署
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "深海笔记"

# 注意：这里没有 theme = "..."，因为主题就是我们自己写的 layouts/

[params]
  description = "写点算法、游戏，还有乱七八糟的小记录。"
  author = "汐"

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true          # 允许在 md 里直接写 HTML

[menu]
  [[menu.main]]
    name = "首页"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 2
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 3

[minify]
  minifyOutput = true
