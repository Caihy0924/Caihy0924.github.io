<ul class="post-list">
  {{- range . }}
  <li class="post-item">
    <a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{- with .Summary }}
    <p class="post-summary">{{ . | plainify | truncate 110 }}</p>
    {{- end }}
  </li>
  {{- else }}
  <li class="post-item"><p class="post-summary">还没有文章，去 content/posts/ 里写第一篇吧。</p></li>
  {{- end }}
</ul>
