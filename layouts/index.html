{{ define "main" }}
  <section class="intro">
    <h1>{{ site.Title }}</h1>
    <p>{{ site.Params.description }}</p>
  </section>

  {{ with .Content }}
  <div class="post-content">{{ . }}</div>
  {{ end }}

  <h2 class="section-title">最新文章</h2>
  {{ partial "post-list.html" (where site.RegularPages "Section" "posts") }}
{{ end }}
