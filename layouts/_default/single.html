{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{- if .ReadingTime }}<span class="dot">·</span>约 {{ .ReadingTime }} 分钟{{ end }}
      {{- with .Params.tags }}
      <span class="dot">·</span>
      {{- range . }}<span class="tag">{{ . }}</span>{{ end }}
      {{- end }}
    </p>
  </header>
  <div class="post-content">{{ .Content }}</div>
</article>
{{ end }}
